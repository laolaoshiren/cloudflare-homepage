  <style>
    :root {
      --stage-w: 1440;
      --stage-h: 900;
      --scale: 1;
      --text: #f5f7ff;
      --muted: rgba(231,236,255,0.72);
      --muted2: rgba(231,236,255,0.52);
      --line: rgba(255,255,255,0.08);
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 50% 18%, rgba(91,140,255,0.18), transparent 60%),
        radial-gradient(700px 300px at 55% 12%, rgba(91,225,255,0.08), transparent 58%),
        linear-gradient(180deg, #0b1020 0%, #070b14 42%, #060912 100%);
    }
    body {
      position: relative;
      user-select: none;
    }
    a { text-decoration: none; color: inherit; }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .stage-shell {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--stage-w) * 1px * var(--scale));
      height: calc(var(--stage-h) * 1px * var(--scale));
      transform: translate(-50%, -50%);
      transform-origin: center center;
    }
    .stage {
      width: calc(var(--stage-w) * 1px);
      height: calc(var(--stage-h) * 1px);
      transform: scale(var(--scale));
      transform-origin: top left;
      position: relative;
      overflow: hidden;
    }

    .wrap {
      width: 100%;
      height: 100%;
      padding: 0 56px;
      display: flex;
      flex-direction: column;

    .nav {

  <script>
    (function () {
      const root = document.documentElement;
      const BASE_W = 1440;
      const BASE_H = 900;
      const MIN_SCALE = 0.42;

      function resizeStage() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        const scaleX = vw / BASE_W;
        const scaleY = vh / BASE_H;
        let scale = Math.min(scaleX, scaleY);

        if (scale > 1) scale = 1;
        if (scale < MIN_SCALE) scale = MIN_SCALE;

        root.style.setProperty('--stage-w', BASE_W);
        root.style.setProperty('--stage-h', BASE_H);
        root.style.setProperty('--scale', scale.toFixed(5));
      }

      window.addEventListener('resize', resizeStage, { passive: true });
      window.addEventListener('orientationchange', resizeStage, { passive: true });
      resizeStage();
    })();
  </script>
